<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>英雄联盟 · 本地助手</title>
  <link rel="stylesheet" href="./style.css">
  <script defer src="./i18n.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><img class="brand-mark" src="./assets/images/logo.png" alt="" aria-hidden="true"><div class="brand-text"><strong>英雄联盟助手</strong><span>纯净版</span></div></div>
      <nav class="navigation" aria-label="主要功能">
        <button type="button" data-page="dashboard" class="nav-button active"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4zM4 10h16M10 10v9"/></svg>对局看板</button>
        <button type="button" data-page="history" class="nav-button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2-5M4 4v4h4M12 8v5l3 2"/></svg>本区战绩</button>
        <button type="button" data-page="builds" class="nav-button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.3 6.8 19.1l1-5.8-4.3-4.1 5.9-.8z"/></svg>英雄推荐</button>
        <button type="button" data-page="automation" class="nav-button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16M8 4v6M16 14v6"/></svg>自动化设置</button>
        <button type="button" data-page="catalog" class="nav-button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5"/></svg>本地资料</button>
        <button type="button" data-page="presets" class="nav-button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 8 9-8 9-8-9zM8 12h8M12 8v8"/></svg>符文与出装</button>
        <button type="button" data-page="tools" class="nav-button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 3-4 4 1 4 4 1 4-4a6 6 0 0 1-8 8l-6 6-4-4 6-6a6 6 0 0 1 7-9z"/></svg>工具箱</button>
      </nav>
      <div class="sidebar-bottom">
        <p>本地配置</p>
        <div class="config-actions"><button type="button" data-action="import-config">导入</button><button type="button" data-action="export-config">导出</button></div>
        <label class="language-picker"><span>语言</span><select id="language-select" aria-label="Language"><option value="zh-CN">中文</option><option value="en">English</option><option value="ko">한국어</option></select></label>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="connection"><span id="connection-dot" class="status-dot" aria-hidden="true"></span><strong id="connection-label">正在读取客户端状态</strong><span id="phase-label" class="phase-label"></span></div>
        <div class="top-actions"><button type="button" class="button ghost compact" data-action="choose-lockfile">手动连接</button><button type="button" class="button secondary compact" data-action="refresh">刷新连接</button></div>
      </header>
      <main id="content" tabindex="-1" aria-label="功能内容"><div class="loading-state"><span class="spinner" aria-hidden="true"></span><p>正在打开本地助手…</p></div></main>
    </div>
  </div>
  <div id="toast-region" class="toast-region" role="status" aria-live="polite" aria-atomic="true"></div>
  <dialog id="detail-dialog" aria-labelledby="dialog-title"><div class="dialog-top"><h2 id="dialog-title">详情</h2><button type="button" class="icon-button" data-action="close-dialog" aria-label="关闭详情"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div><div id="dialog-body" class="dialog-body"></div></dialog>
</body>
</html>
